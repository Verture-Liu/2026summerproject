name: Windows development installer

on:
  workflow_dispatch:
  push:
    paths:
      - "packaging/windows/**"
      - "src/research_agent/**"
      - "tests/packaging/test_windows_*.py"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-zlib

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Run platform-neutral packaging tests
        shell: powershell
        run: |
          python -m pip install -e . pytest
          python -m pytest tests/packaging/test_windows_packaging_contract.py tests/packaging/test_windows_stage_tools.py tests/packaging/test_windows_launcher_contract.py tests/packaging/test_windows_installer_contract.py tests/packaging/test_windows_release_docs.py -q

      - name: Build installer
        id: build
        continue-on-error: true
        shell: powershell
        run: |
          ./packaging/windows/scripts/build.ps1 -Python python *>&1 |
            Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaleoRigor-Windows-build-log
          path: |
            windows-build.log
            windows-build-stage.txt
          if-no-files-found: warn

      - name: Report installer build failure
        if: steps.build.outcome == 'failure'
        shell: powershell
        run: |
          $Stage = (Get-Content windows-build-stage.txt -Raw).Trim()
          $Log = Get-Content windows-build.log -Raw
          $Category = "unclassified build error"
          if ($Log -match "ModuleNotFoundError:\s+No module named .(?<module>[A-Za-z0-9_.-]+)") {
            $Category = "missing Python module: $($Matches.module)"
          } elseif ($Log -match "FileNotFoundError") {
            $Category = "missing build file"
          } elseif ($Log -match "RecursionError") {
            $Category = "Python recursion limit"
          } elseif ($Log -match "MemoryError|out of memory") {
            $Category = "build memory exhaustion"
          } elseif ($Log -match "ImportError") {
            $Category = "Python import failure"
          } elseif ($Log -match "PermissionError|Access is denied") {
            $Category = "build file permission failure"
          } elseif ($Log -match "Unable to find|does not exist|not found") {
            $Category = "missing PyInstaller input or dependency"
          } elseif ($Log -match "Invalid.*tuple|Invalid.*spec") {
            $Category = "invalid PyInstaller specification"
          } elseif ($Log -match "(?m)^(?<kind>[A-Za-z][A-Za-z0-9]*(?:Error|Exception)):") {
            $Category = "Python exception type: $($Matches.kind)"
          } elseif ($Log -match "Traceback \(most recent call last\)") {
            $Category = "unclassified Python traceback"
          } elseif ($Log -match "PyInstaller.*ERROR|ERROR:.*PyInstaller") {
            $Category = "PyInstaller internal error"
          }
          "## Windows installer build failure`n`nFailed during: **$Stage**`n`nCategory: **$Category**" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "::error title=Windows installer build failed::$Stage; $Category"
          exit 1

      - name: Run native smoke checks
        if: steps.build.outcome == 'success'
        shell: powershell
        run: ./packaging/windows/scripts/smoke_test.ps1 -Installer ./dist/PaleoRigor-Setup.exe

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: PaleoRigor-Windows-development
          path: |
            dist/PaleoRigor-Setup.exe
            paleorigor/windows/SHA256SUMS.txt
            paleorigor/windows/verification.json
          if-no-files-found: error
