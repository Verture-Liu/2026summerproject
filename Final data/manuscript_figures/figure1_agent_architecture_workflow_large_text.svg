<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1800" viewBox="0 0 3600 1800"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:72px;font-weight:700;fill:#1f2933}.sub{font-size:39px;fill:#5f6b7a}.bt{font-size:46px;font-weight:700}.bb{font-size:34px;fill:#5f6b7a}.sec{font-size:48px;font-weight:700;fill:#1f2933}.skill{font-size:40px;font-weight:700;fill:#1f2933}</style><rect width="3600" height="1800" fill="white"/><text x="1800" y="130" text-anchor="middle" class="title">Human-in-the-loop architecture for rigorous paleomicrobiome analysis</text><text x="1800" y="198" text-anchor="middle" class="sub">The LLM proposes; experts review; constrained local skills execute auditable ancient-data checks.</text><text x="1800" y="890" text-anchor="middle" class="sec">Ancient-data skill / tool layer</text><text x="180" y="1425" class="sec">Design principle</text><text x="180" y="1502" class="sub">Planning, execution, and interpretation are separated so ancient-data analyses remain inspectable and reproducible.</text></svg>